[package]
name = "engine_rs"
version = "0.1.0"
edition = "2021"
description = "Rust hot path for androidllm: seeded sampling, bit-equal to numpy"

[lib]
name = "engine_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["abi3-py39", "extension-module"] }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
